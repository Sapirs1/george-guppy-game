name: Deploy fishery farm site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Without this the deploy shipped site/game/src as a checked-in build
      # artifact, so fixes made in george-guppy/src/ silently never reached
      # production while fixes made directly to site/game/src/ were wiped by
      # the next local build. That divergence let a black-screen crash sit in
      # the source unnoticed. There is now one source of truth: george-guppy/src.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Build the game from source
        run: node tools/build-site-game.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
